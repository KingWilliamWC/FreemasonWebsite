<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | St John In Bedwardine Lodge 7458</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="freemasonry.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="header"></div>

  <main>
    <section class="page-hero">
      <div class="page-hero-inner">
        <p class="section-label">Thank You</p>
        <h1>Your enquiry has been sent</h1>
        <p class="page-hero-lead">
          Thank you for getting in touch. Your message has been submitted and a member
          of the lodge will respond as soon as possible.
        </p>
      </div>
    </section>

    <section class="intro-section">
      <div class="page-container narrow center-text">
        <div class="success-panel">
          <div class="success-mark" aria-hidden="true">
            <svg viewBox="0 0 120 120" class="success-mark-svg">
              <circle class="success-ring" cx="60" cy="60" r="46"></circle>
              <path class="success-check" d="M36 61 L52 76 L84 43"></path>
            </svg>
            <div class="success-pulse success-pulse-one"></div>
            <div class="success-pulse success-pulse-two"></div>
          </div>

          <p class="section-label center">Message Received</p>
        </div>

        <p class="lead-text">
          Your message is now with us.
        </p>
        <p class="success-supporting-copy">
          We will review your message and reply as soon as possible.
        </p>
        <p class="cta-copy" style="color:#6d6257; margin-top:24px;">
          <a href="contact.html" class="btn btn-gold">Back to Contact</a>
        </p>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="loader.js"></script>
</body>
</html>
